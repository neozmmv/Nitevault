services:
  api:
    build:
      context: ./backend
    container_name: nitevault-api
    ports:
      - "5172:8080"
    environment:
      JWT_KEY: ${JWT_KEY}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_CONNECTION: ${REDIS_CONNECTION}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      BOT_TOKEN: ${BOT_TOKEN}
      CHAT_ID: ${CHAT_ID}
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      telegram-bot-api:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - backend/bin/
            - backend/obj/
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: nitevault-frontend
    ports:
      - "3000:3000"
    environment:
      ORIGIN: http://localhost:3000
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nitevault
      POSTGRES_PASSWORD: nitevault
      POSTGRES_DB: nitevault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nitevault -d nitevault"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    ports:
      - "8081:8081"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot-api-cleanup:
    image: alpine:latest
    container_name: bot-api-cleanup
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    entrypoint: >
      sh -c "while true; do
        find /var/lib/telegram-bot-api -type f -mmin +1440 -delete;
        sleep 86400;
      done"
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  telegram_bot_api_data:
